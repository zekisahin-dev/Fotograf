<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotoğrafı Kim Aldı?</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 24px; background: #111827; color: #f9fafb; font-family: system-ui, sans-serif; text-align: center; }
    main { max-width: 900px; margin: auto; }
    img, video { display: block; width: 100%; max-height: 80vh; object-fit: contain; margin: 20px auto; border-radius: 12px; background: #000; }
    h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); }
    #video-section { display: none; }
    .hint { color: #9ca3af; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Fotoğrafı Kim Aldı?</h1>
    <img src="fotografi-kim-aldi.jpg" alt="Fotoğraf">
    <section id="video-section">
      <h2>Video</h2>
      <video id="video" controls playsinline preload="metadata">
        <source src="video.mp4" type="video/mp4">
        Tarayıcınız video oynatmayı desteklemiyor.
      </video>
    </section>
    <p class="hint">Sümeyye :)</p>
  </main>
  <script>
    fetch('video.mp4', { method: 'HEAD' })
      .then(response => { if (response.ok) document.getElementById('video-section').style.display = 'block'; })
      .catch(() => {});
  </script>
</body>
</html>
